<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Combining Selectors</title>
</head>
<body>
    <h1>To Do List</h1>
    <h2>Monday</h2>
    <div class="box">
        <p class="done">Do this things today!</p>
        <ul class="list">
            <li>Go to the gym</li>
            <li class="done">Buy groceries</li>
            <li class="done">Finish homework</li>
        </ul>
    </div>

    <div>
        <ul>
            <p class="done">Other items</p>
        </ul>
        <p>The best preparation for tomorrow is doing your best today.</p>
    </div>
</body>
</html>
